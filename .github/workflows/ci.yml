name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy, serving layer and API)
        run: mypy
      - name: Tests (pytest)
        run: pytest

  image:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t femto-rul-api .
      - name: Smoke test the running container
        run: |
          docker run -d --name api -p 8000:8000 femto-rul-api
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          echo
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/demo/replay/Bearing3_3 | grep -q '"alarm_at_end":true'
          curl -fsS http://localhost:8000/ | grep -q "Bearing degradation monitor"
      - name: Container logs
        if: always()
        run: docker logs api || true
