[project]
name = "femto-rul"
version = "0.2.0"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["src", "api"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/serving.py", "api"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
